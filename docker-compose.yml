services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      # Host port 5433 avoids colliding with a locally-installed Postgres
      # (Homebrew/Postgres.app) that may already be bound to 5432.
      - "5433:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  iris_pgdata:
