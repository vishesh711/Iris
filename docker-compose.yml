services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      # A deliberately unusual host port: 5432 and 5433 are both common
      # enough (Homebrew/Postgres.app, replica-port conventions) that they
      # kept colliding with something already running locally.
      - "55432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  iris_pgdata:
